const POOL_L=['thug','shield','gunner','thrower','brute','sniper','bomber','gunshield','flamer','medic','hammer'];
const BOSS_KEYS=['ironmask','blade','twin','havoc','warlord','shadow'];
let bestEndless=0;
try{ bestEndless=parseInt(localStorage.getItem('mj_best')||'0',10)||0; }catch(err){ bestEndless=0; }
const endlessCache={};
function endlessLevel(n){
  if(endlessCache[n]) return endlessCache[n];
  const boss = (n%5===0);
  const width = 3200 + ((n*137)%7)*300;
  const plats=[]; const pn=6+((n*53)%4);
  for(let i=0;i<pn;i++){
    plats.push({x: Math.round(400+(width-800)*(i/Math.max(1,pn-1))+((n*31+i*17)%90-45)),
                y: 440+((n*19+i*29)%4)*25, w: 150+((n*11+i*7)%50), h:22});
  }
  const pool = n<24? POOL_E : (n<32? POOL_M : POOL_L);
  const cnt = Math.min(22, 10+Math.floor((n-18)*0.9));
  const spawns=[];
  for(let i=0;i<cnt;i++)
    spawns.push({t:pool[(n*7+i*13)%pool.length],
      x: Math.round(clamp(600+(width-900)*(i/Math.max(1,cnt-1))+((n*23+i*37)%120-60),200,width-200))});
  const meds=[];
  for(let i=0;i<3;i++) meds.push({x:Math.round(clamp(800+(width-1200)*(i/2),200,width-200)),y:GROUND});
  const bk = BOSS_KEYS[Math.floor(n/5-1)%BOSS_KEYS.length];
  const lv={no:n, name:'第 '+n+' 区', sub:'SECTOR '+n, brief:['……'],
    width:width, plats:plats, spawns:spawns, meds:meds, unlock:[],
    goal: boss? {type:'boss',text:'击败 '+BOSSES[bk].name}
              : {type:'reach',x:width-220,minKills:Math.min(18,8+Math.floor((n-18)*0.7))},
    boss: boss? bk : null, bossX: boss? width-420 : 0};
  endlessCache[n]=lv; return lv;
}

function loadLevel(i){
  LIdx=i;
  L = (i<LEVELS.length)? LEVELS[i] : endlessLevel(i+1);   // 第 19 关起走程序化关卡
  // 战役按章切背景；无尽模式每 5 关换一套（正好配合 BOSS 节奏）
  CHAP = (i<LEVELS.length)? chapOf(L.no) : (Math.floor(i/5))%4;
  PAL=CHAPTERS[CHAP];
  if(mode.key==='endless' && (i+1)>bestEndless){ bestEndless=i+1;
    try{ localStorage.setItem('mj_best',String(bestEndless)); }catch(err){} }
  enemies=[];bullets=[];beams=[];parts=[];floats=[];swings=[];kits=[];shells=[];allies=[];
  // 每关一点随机小风：量很小（±40 px/s²），只够让超远距离的弹道需要微调
  wind = PHYS.on ? rr(-PHYS.windMax,PHYS.windMax) : 0;
  // 关卡固定补给点：远程关必须给回血口，否则只能靠开局那管血硬撑
  for(const m of (L.meds||[])) kits.push({x:m.x,y:m.y,taken:false});
  // 护甲片：每关一个固定补给。噩梦不给 —— 那一档就是要逼你靠闪避，而不是靠甲硬吃
  if(diff.key!=='nightmare')
    kits.push({x:clamp(L.width*0.55,140,L.width-140),y:GROUND,taken:false,type:'armor'});
  P.x=120;P.y=GROUND;P.vx=0;P.vy=0;P.onGround=true;P.jumps=0;
  P.hpMax=diff.php;                       // 难度直接决定这一管血有多厚
  P.hp=P.hpMax;
  P.armorMax=cls.armorMax; P.armor=Math.round(cls.armorMax*cls.armorPct);   // 开局只带一部分甲
  P.reloading=0;P.fireCd=0;P.grenadeCd=0;P.dash=0;P.dashCd=0;P.invuln=0;
  P.grenades=2+cls.grenade;               // 手雷每关重置：基础 2 个 + 兵种加成
  P.lastSafeX=120;P.lastY=GROUND;P.kx=0;
  // 兵种起始武器只在开新局时给（否则每关都会把玩家手里那把抢回去）
  if(i===0){ for(const w of cls.start) P.owned[w]=true; P.weapon=cls.start[0]; }
  for(const u of L.unlock) P.owned[u]=true;
  if(!P.owned[P.weapon]) P.weapon=0;
  WEAPONS.forEach(w=>{ P.ammo[w.id]= w.kind==='gun'
    ? Math.max(1,Math.ceil(w.mag*diff.ammo*cls.ammo)) : 0; });
  killed=0;bossRef=null;goalDone=false;doneT=0;camX=0;P.hurtFlash=0;
  for(const s of L.spawns){
    spawnEnemy(s.t,s.x);
    // 难度的 count：给每个刷兵点按比例追加同类敌兵（位置错开，不会叠在一起）
    let extra=diff.count-1;
    while(extra>0){
      if(extra>=1 || Math.random()<extra)
        spawnEnemy(s.t, clamp(s.x+rr(-170,170),90,L.width-90));
      extra-=1;
    }
  }
  // 我方友军：工程带 2 名（一前一后），其余 1 名（跟在身后）
  for(let k=0;k<(cls.allies||0);k++) spawnAlly(P.x + (k===1? 170 : -80), k);
  screen='play';
}

function spawnBioWave(){

  for(const grp of w){

  sfx('boom');
}
function updateBio(dt){

    bioTimer-=dt;
    if(bioTimer<=0){ spawnBioWave(); bioState='fight'; }
    return;

function spawnEnemy(t,x,y){

    face:-1,cd:rr(0.3,1.2),dead:false,flash:0,anim:rr(0,6),hurtT:0,active:false,

// ============================================================
//  我方友军 NPC：跟随玩家、向最近敌人开火、会替你挡子弹、会阵亡
// ============================================================
// slot 0 = 跟在身后（保命，纯火力支援）；slot 1 = 站在身前（会替你挡枪，也会阵亡）
function spawnAlly(x,slot){
  const a={x:clamp(x,80,L.width-80),y:GROUND,hp:180,hpMax:180,face:1,aim:0,
    cd:rr(0.4,1.2),anim:rr(0,6),dead:false,flash:0,follow:rr(150,230),slot:slot||0};
  allies.push(a); return a;
}
function updateAllies(dt){
  for(let i=allies.length-1;i>=0;i--){
    const a=allies[i];
    if(a.dead){ allies.splice(i,1); continue; }
    if(a.flash>0) a.flash-=dt;
    a.anim+=dt*4;
    // 跟随：slot 0 守在身后，slot 1 顶在身前（身前那个就是拿来挡子弹的）
    const target=P.x + (a.slot===1? a.follow : -a.follow);
    const dx=a.x-target, ad=Math.abs(dx);
    if(ad>55) a.x -= Math.sign(dx)*210*dt;
    a.x=clamp(a.x,60,L.width-60);
    // 找最近的敌人并开火
    let best=null,bd=1e9;
    for(const e of enemies){ if(e.dead) continue;
      const d=Math.abs(e.x-a.x); if(d<bd){bd=d;best=e;} }
    if(best && bd<560){
      const ey=best.y-34*(best.c.h||1);
      a.aim=Math.atan2(ey-(a.y-34), best.x-a.x);
      a.face = best.x>a.x?1:-1;
      a.cd-=dt;
      if(a.cd<=0){
        const ang=a.aim+(rnd()-0.5)*6*Math.PI/180;
        bullets.push({x:a.x,y:a.y-34,vx:Math.cos(ang)*1400,vy:Math.sin(ang)*1400,
          dmg:22,life:1.6,friendly:true,grenade:false,r:3,owner:-2,knock:60,g:0,drag:0,bounce:0});
        a.cd=rr(0.75,1.1);
      }
    } else { a.face = P.x>a.x?1:-1; a.aim=a.face>0?0:Math.PI; }
  }
}
// ============================================================
//  感染机制（生化模式）
// ============================================================
function addInfect(v){
  if(mode.key!=='bio') return;
  P.infect=Math.min(100,(P.infect||0)+v);
  P.hurtFlash=Math.max(P.hurtFlash,0.35);
  if(P.infect>=100 && screen==='play'){
    infected=true; screen='over';
    for(let i=0;i<16;i++) puff(P.x,P.y-34,COL.hp);
  }
}
// 友军被啃到感染值满 / 血量归零 → 当场转化成一只行尸
function infectAlly(a){
  const i=allies.indexOf(a); if(i<0) return;
  allies.splice(i,1);
  const z=spawnEnemy('zwalker', a.x); if(z) z.active=true;
  for(let k2=0;k2<12;k2++) puff(a.x,GROUND-30,COL.hp);
  hint='友军被感染了'; hintT=1.8;
}
// 敌人会主动选目标：最近的人类（玩家或友军）。
// bias > 0 表示更愿意扑友军 —— 这就是友军能当肉盾的原因，也是他们会牺牲的原因
function nearestHuman(e,bias){
  let t={x:P.x,y:P.y-38,isPlayer:true,ref:null};
  let bd=Math.abs(P.x-e.x);
  for(const a of allies){
    if(!a || a.dead) continue;
    const d=Math.abs(a.x-e.x)-(bias||0);
    if(d<bd){ bd=d; t={x:a.x,y:a.y-34,isPlayer:false,ref:a}; }
  }
  return t;
}
function killAlly(a){
  const i=allies.indexOf(a); if(i<0) return;
  allies.splice(i,1);
  hint='友军倒下了'; hintT=1.6;
  for(let k=0;k<10;k++) puff(a.x,a.y-34,COL.cyan);
}
// 统一结算伤害：打到玩家还是打到友军（友军死在生化模式里是转化，其余是阵亡）
function strikeTarget(t,dmg,infect){
  // 近战（拳/爪/刀）绕甲 35%：贴身的攻击能从甲缝里钻进来，逼你不能只靠甲站着不动
  if(!t || t.isPlayer){ hurtPlayer(dmg, 0.35); if(infect) addInfect(infect); return; }
  const a=t.ref;
  if(!a || a.dead || allies.indexOf(a)<0){ hurtPlayer(dmg, 0.35); if(infect) addInfect(infect); return; }
  a.hp-=dmg; a.flash=0.08;
  for(let i=0;i<3;i++) puff(a.x,a.y-34,COL.danger);
  if(infect){
    a.infect=(a.infect||0)+infect;
    if(a.infect>=100){ infectAlly(a); return; }   // 生化：感染值满即转化
  }
  if(a.hp<=0){ if(mode.key==='bio') infectAlly(a); else killAlly(a); }
}
// 感染者近战：扑向最近的人类（bias 60 = 明显优先咬友军）
function zombieStrike(e,dmg){
  swings.push({x:e.x+e.face*30,y:e.y-40,a:e.face>0?0:Math.PI,r:70,arc:80,t:0,life:0.14});
  strikeTarget(nearestHuman(e,60), dmg, e.c.infect);
}
function spawnBoss(key,x){
  const c=BOSSES[key];
  const hp=Math.round(c.hp*diff.hp);
  const b={t:'boss',key:key,c:c,x:x,y:GROUND,hp:hp,hpMax:hp,
    atk:Math.max(1,Math.round(c.atk*diff.atk)),
    face:-1,cd:1.4,dead:false,flash:0,anim:0,hurtT:0,active:true,phase:1,
    dashT:0,teleT:2,warnT:0,warnA:0,slamT:0,combo:0};
  enemies.push(b); bossRef=b;
  hint='对手：'+c.name; hintT=3;
  return b;
}

// ============================================================
//  玩家
// ============================================================
function updatePlayer(dt){
  const sp=305*cls.spd;
  let mv=0;
  if(keys['a']||keys['ArrowLeft']) mv-=1;
  if(keys['d']||keys['ArrowRight']) mv+=1;

  if(P.dashCd>0) P.dashCd-=dt;
  if(once('Shift') && P.dash<=0 && P.dashCd<=0){
    P.dash=0.28;P.dashCd=1.2*cls.dashCd;P.invuln=Math.max(P.invuln,0.32);
    P.vx=(mv!==0?mv:P.face)*780;
    for(let i=0;i<8;i++) puff(P.x,P.y-20,COL.cyan);
  }
  if(P.dash>0){ P.dash-=dt; P.vx*=0.90; } else P.vx=mv*sp;
  if(mv!==0&&P.dash<=0) P.face=mv;
  P.x+=P.vx*dt;
  // 后坐力冲量：单独积分并快速衰减，不会干扰正常的移动输入
  if(P.kx){ P.x+=P.kx*dt; P.kx*=Math.pow(0.04,dt); if(Math.abs(P.kx)<3) P.kx=0; }

  if(once('w')||once(' ')||once('ArrowUp')){
    if(P.onGround){ P.vy=-700;P.onGround=false;P.jumps=1; }
    else if(P.jumps<2){ P.vy=-600;P.jumps=2; for(let i=0;i<6;i++) puff(P.x,P.y,COL.platEdge); }
  }
  P.vy+=2000*dt; P.y+=P.vy*dt;

  let onPlat=false;
  if(P.vy>=0){
    if(P.y>=GROUND){ P.y=GROUND;P.vy=0;P.onGround=true;P.jumps=0;onPlat=true; }
    if(!onPlat) for(const pl of L.plats||[]){
      if(P.x>pl.x-14&&P.x<pl.x+pl.w+14&&P.y>=pl.y-2&&P.y<=pl.y+34&&P.lastY<=pl.y+6){
        P.y=pl.y;P.vy=0;P.onGround=true;P.jumps=0;onPlat=true;break;
      }
    }
    if(!onPlat) P.onGround=false;
  } else P.onGround=false;
  P.lastY=P.y;
  P.x=clamp(P.x,40,L.width-40);
  if(P.y>820){ P.y=GROUND;P.x=P.lastSafeX;hurtPlayer(15); }
  if(P.onGround&&Math.abs(P.vx)>10) P.lastSafeX=P.x;

  P.aim=Math.atan2(mouse.y-(P.y-38),(mouse.x+camX)-P.x);
  if(Math.cos(P.aim)>=0) P.face=1; else P.face=-1;

  const w=W();
  if(P.reloading>0){ P.reloading-=dt; if(P.reloading<=0) P.ammo[w.id]=w.mag; }
  if(P.fireCd>0) P.fireCd-=dt;

  if(mouse.down && P.fireCd<=0){
    if(w.kind==='melee'){ if(P.reloading<=0) fire(); }
    else if(P.reloading<=0){
      if(P.ammo[w.id]>0) fire(); else P.reloading=w.reload;
    }
  }
  if(once('r') && w.kind==='gun' && P.reloading<=0 && P.ammo[w.id]<w.mag) P.reloading=w.reload;

  // 换武器：1-9/0 对应前 10 把，z x c v b n 对应后 6 把
  for(let i=0;i<WEAPONS.length;i++){
    const k=WKEYS[i];
    if(k && once(k) && P.owned[i]){ P.weapon=i; P.reloading=0; P.fireCd=Math.max(P.fireCd,0.12); }
  }
  if(once('q')||once('e')){
    const dir=once('q')?-1:1;
    for(let i=1;i<=WEAPONS.length;i++){
      const n=(P.weapon+dir*i+WEAPONS.length*4)%WEAPONS.length;
      if(P.owned[n]){ P.weapon=n;P.reloading=0;break; }
    }
  }
  if(P.grenadeCd>0) P.grenadeCd-=dt;
  if(once('g')&&P.grenades>0&&P.grenadeCd<=0){
    P.grenades--;P.grenadeCd=0.6;
    bullets.push({x:P.x,y:P.y-38,vx:Math.cos(P.aim)*700,vy:Math.sin(P.aim)*700-220,
      dmg:0,life:2.2,friendly:true,grenade:true,r:7,owner:-1});
  }
  if(P.invuln>0) P.invuln-=dt;
  if(P.hurtFlash>0) P.hurtFlash-=dt;
  P.anim+=dt*(Math.abs(P.vx)>10?10:3);
}

function fire(){
  const w=W();
  P.fireCd=1/w.rate;
  const mx=P.x+Math.cos(P.aim)*26, my=P.y-38+Math.sin(P.aim)*26;
  if(w.kind==='melee'){
    // 近战：一次性扇形判定，命中所有在弧内的人；segs 表示一次挥击打几段（双刀=2）
    const half=w.arc*Math.PI/360;
    const segs=w.segs||1;
    let hits=0;
    for(let sg=0; sg<segs; sg++){
      for(const e of enemies){
        if(e.dead) continue;
        const ey=e.y-34*(e.c.h||1);
        const dist=Math.hypot(e.x-mx, ey-my);
        if(dist > w.range + 16) continue;
        if(Math.abs(angDiff(Math.atan2(ey-my,e.x-mx), P.aim)) > half) continue;
        damageEnemy(e, w.dmg, mx, my, w.knock, true);
        hits++;
      }
    }
    swings.push({x:mx,y:my,a:P.aim,r:w.range,arc:w.arc,t:0,life:0.16});
    shake=Math.max(shake, 3+hits);
    if(hits===0) puff(mx+Math.cos(P.aim)*w.range*0.6, my+Math.sin(P.aim)*w.range*0.6, COL.mute);
    sfx('swing');
    return;
  }
  // 枪械
  P.ammo[w.id]--;
  muzzle=0.07; shake=Math.max(shake,w.id===11?4:2.5);

  // 后坐力：走独立冲量 kx/ky —— 玩家 vx 每帧被移动输入覆盖，直接改 vx 会被立刻抹掉。
  // 地面上因摩擦几乎无感；空中开枪能把自己推一段，重武器（霰弹/狙击）可当小位移用。
  const rc=(w.recoil||0)*(PHYS.on?1:0.4);
  P.kx -= Math.cos(P.aim)*rc*(P.onGround?0.55:1);   // 地面有支撑，水平推动衰减大半
  // 空中开枪的后坐力给得比地面足：向下射击能明显减缓下落，重武器甚至能当小位移用
  if(!P.onGround) P.vy=Math.max(-820, P.vy - Math.sin(P.aim)*rc*1.6);

  // 弹壳抛出：带重力与自转，落地后淡出
  if(shells.length<90){
    const ea=P.aim + (P.face>0? 1.9 : -1.9);
    shells.push({x:mx,y:my,vx:Math.cos(ea)*rr(120,260),vy:Math.sin(ea)*rr(120,240)-160,
      a:rr(0,6.28),va:rr(-16,16),t:0,life:1.1,bounced:0});
  }

  if(w.hitscan){
    // 狙击：物理开启时改为超高速弹丸（保留贯穿 3 人），这样跨屏才有真实下坠
    const a=P.aim;
    beams.push({x1:mx,y1:my,x2:mx+Math.cos(a)*260,y2:my+Math.sin(a)*260,t:0,life:0.06});
    bullets.push(mkBullet(mx,my,a,w,w.dmg));
    sfx('sniper');
  } else {
    for(let i=0;i<(w.pellets||1);i++){
      const a=P.aim+(rnd()-0.5)*w.spread*Math.PI/180;
      bullets.push(mkBullet(mx,my,a,w,w.dmg));
    }
    sfx(w.id===11?'shotgun':'shot');
  }
  for(let i=0;i<3;i++) puff(mx,my,COL.gold);
}
// 子弹工厂：把武器的物理参数一次性固化到弹体上
let BID=0;
function mkBullet(x,y,a,w,dmg){
  const sp=w.pspd||1200;
  return {id:++BID,x:x,y:y,px:x,py:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
    dmg:dmg,life:1.8,friendly:true,grenade:false,r:w.explosive?6:(w.id===13?4:3),
    owner:w.id,knock:w.knock,boom:w.explosive||0,
    g:(w.grav||0)*(PHYS.on?1:0), drag:PHYS.on?(w.drag||0):0,
    bounce:PHYS.on?(w.bounce||0):0, pierce:w.pierce||0, hit:null,
    spin:0, trail:[]};
}
function segNear(px,py,ax,ay,bx,by,rad){
  const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
  let t=L2>0?((px-ax)*dx+(py-ay)*dy)/L2:0; t=clamp(t,0,1);
  const cx=ax+t*dx, cy=ay+t*dy;
  return Math.hypot(px-cx,py-cy)<rad ? Math.hypot(px-ax,py-ay) : null;
}

// ============================================================
//  敌人
// ============================================================
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){ enemies.splice(i,1); continue; }
    if(e.flash>0) e.flash-=dt;
    if(e.hurtT>0) e.hurtT-=dt;
    if(!e.active && Math.abs(e.x-P.x)<900) e.active=true;
    if(!e.active) continue;
    if(e.slow>0) e.slow-=dt;
    // 击飞中：走抛物线，落地前既不移动也不出手（这就是击退的价值）
    if(e.stun>0){ e.stun-=dt; updateEnemyPhys(e,dt); continue; }
    if(e.air){ updateEnemyPhys(e,dt); continue; }

    const dist=e.x-P.x, adist=Math.abs(dist);
    e.face = dist>0?-1:1;
    e.anim += dt*3;
    if(e.t==='boss'){ updateBoss(e,dt); continue; }

    const spd=e.spd*(e.slow>0?0.45:1);   // 打腿减速
    const want = e.c.melee ? 60 : e.c.range*0.7;
    if(adist>want+20) e.x -= Math.sign(dist)*spd*dt*0.75;
    else if(adist<want-50) e.x += Math.sign(dist)*spd*dt*0.5;
    e.x=clamp(e.x,60,L.width-60);

    e.cd-=dt;
    const ey=e.y-34*e.c.h;
    // 医师：不出手，专职奶周围受伤的敌兵 —— 它活着，你前面打的血就白掉
    if(e.c.heal){
      if(e.cd<=0){
        let tgt=null,bd=1e9;
        for(const o of enemies){
          if(o.dead||o===e||o.hp>=o.hpMax) continue;
          const d=Math.abs(o.x-e.x);
          if(d<e.c.range && d<bd){ bd=d; tgt=o; }
        }
        if(tgt){
          tgt.hp=Math.min(tgt.hpMax, tgt.hp+e.c.heal);
          floats.push({v:'+'+e.c.heal,x:tgt.x,y:tgt.y-70,t:0,life:0.7,heal:true});
          for(let i=0;i<6;i++) puff(tgt.x,tgt.y-34,COL.hp);
          e.cd=e.c.rate;
        } else e.cd=0.4;
      }
      continue;
    }
    // 狙击手：开火前站定蓄力并拉出预警线（charge 秒），给玩家躲避窗口
    if(e.c.charge){
      if(e.warnT>0){
        e.warnT-=dt;
        e.warnA=Math.atan2((P.y-38)-ey, P.x-e.x);
        if(e.warnT<=0){
          bullets.push({x:e.x,y:ey,vx:Math.cos(e.warnA)*e.c.bspd,vy:Math.sin(e.warnA)*e.c.bspd,
            dmg:e.atk,life:2.4,friendly:false,grenade:false,r:4,owner:-1});
          e.cd=e.c.rate; e.warnT=0;
        }
        continue;                       // 蓄力期间不移动
      }
      if(e.cd<=0 && adist<e.c.range){ e.warnT=e.c.charge; e.warnA=Math.atan2((P.y-38)-ey,P.x-e.x); continue; }
    }
    if(e.cd<=0 && adist < e.c.range){
      e.cd=e.c.rate;
      if(e.c.melee){
        if(adist<e.c.range+10){
          const dmg=Math.round(e.atk*(0.85+rnd()*0.3));
          if(e.c.infect) zombieStrike(e,dmg);      // 感染者：啃人并累积感染值
          else {
            hurtPlayer(dmg);
            swings.push({x:e.x+e.face*30,y:e.y-40,a:e.face>0?0:Math.PI,r:70,arc:80,t:0,life:0.14});
          }
        }
      } else if(e.c.lob){
        // 炸弹兵：抛物线炸弹，落地范围伤害 —— 逼你离开掩体
        const vx=clamp((P.x-e.x)*0.85, -560, 560);
        bullets.push({x:e.x,y:ey,vx:vx,vy:-430,dmg:e.atk,life:2.6,
          friendly:false,grenade:true,r:7,owner:-1});
      } else if(e.c.flame){
        // 喷火兵：短射程、高频率的火焰，站着硬吃会被烧穿
        const a=Math.atan2((P.y-38)-ey, P.x-e.x)+(rnd()-0.5)*e.c.spread*Math.PI/180;
        bullets.push({x:e.x,y:ey,vx:Math.cos(a)*e.c.bspd,vy:Math.sin(a)*e.c.bspd,
          dmg:e.atk,life:0.30,friendly:false,grenade:false,r:8,owner:-1,flame:true});
      } else {
        const a=Math.atan2((P.y-38)-ey, P.x-e.x)+(rnd()-0.5)*e.c.spread*Math.PI/180;
        bullets.push({x:e.x,y:ey,vx:Math.cos(a)*e.c.bspd,vy:Math.sin(a)*e.c.bspd,
          dmg:e.atk,life:2.4,friendly:false,grenade:false,r:e.c.knife?5:4,owner:-1,
          infect:e.c.infect||0});   // 吐酸的酸液也会累积感染值
      }
    }
  }
}
// 敌人被击飞后的物理：水平冲量快速衰减，垂直走重力，落地按速度决定弹一下还是趴住
function updateEnemyPhys(e,dt){
  e.x += (e.kx||0)*dt;
  e.y += (e.ky||0)*dt;
  e.ky = (e.ky||0) + 2000*dt;
  e.kx = (e.kx||0)*Math.pow(0.10,dt);
  if(e.y>=GROUND){
    e.y=GROUND;
    if(e.ky>240){ e.ky=-e.ky*0.32; e.kx*=0.5; for(let i=0;i<4;i++) puff(e.x,GROUND,COL.mute); }
    else { e.ky=0; e.kx=0; e.air=0; }
  }
  e.x=clamp(e.x,60,L.width-60);
}
// BOSS 通用动作
function bossVolley(b,n,spreadDeg,spd,mul){
  const ey=b.y-40*(b.c.h||1);
  const a0=Math.atan2((P.y-38)-ey, P.x-b.x);
  for(let k=0;k<n;k++){
    const a=a0+(n>1?(k-(n-1)/2)*spreadDeg*Math.PI/180:0);
    bullets.push({x:b.x,y:ey,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      dmg:Math.round(b.atk*(mul||0.6)),life:2.4,friendly:false,grenade:false,r:5,owner:-1});
  }
}
function bossMelee(b,range,arc,mul){
  hurtPlayer(Math.round(b.atk*(mul||1)*(0.9+rnd()*0.3)));
  swings.push({x:b.x+b.face*40,y:b.y-46,a:b.face>0?0:Math.PI,r:range,arc:arc,t:0,life:0.18});
}
function bossSummon(b,t,n){
  for(let i=0;i<n;i++){
    const x=clamp(b.x+(i%2===0?-170:170)+rr(-50,50),80,L.width-80);
    const e=spawnEnemy(t,x); e.active=true;
    for(let j=0;j<6;j++) puff(x,GROUND-30,'#C9A0FF');
  }
  hint='援军到场'; hintT=1.6;
}
// 震地：跳起砸下，范围内玩家受伤（有 0.5 秒预警，可以跳开或翻滚）
function bossSlam(b,dt){
  if(b.slamT>0){
    b.slamT-=dt;
    if(b.slamT<=0){
      shake=Math.max(shake,16);
      for(let i=0;i<22;i++) puff(b.x+rr(-90,90),GROUND,COL.gold);
      if(Math.abs(b.x-P.x)<210 && P.onGround) hurtPlayer(Math.round(b.atk*1.1));
      b.cd=rr(1.2,1.8);
    }
    return true;
  }
  return false;
}
function updateBoss(b,dt){
  b.cd-=dt;
  const dist=b.x-P.x, adist=Math.abs(dist);
  b.face = dist>0?-1:1;
  const frac=b.hp/b.hpMax;
  b.phase = frac>0.6?1:(frac>0.3?2:3);
  const st=b.c.style||b.key;

  if(st==='shadow'){                       // 影：瞬移 + 突进
    b.teleT-=dt;
    if(b.teleT<=0){ b.x=P.x+(rnd()<0.5?-1:1)*rr(300,480); b.x=clamp(b.x,80,L.width-80);
      b.teleT=rr(2.2,3.4); for(let i=0;i<10;i++) puff(b.x,b.y-40,'#C9A0FF'); }
    if(b.dashT>0){ b.dashT-=dt; b.x-=b.face*560*dt; }
    else if(b.cd<=0 && adist<220){
      bossMelee(b,95,90,1);
      b.cd = b.phase===3?rr(0.7,1.0):rr(1.0,1.4);
      if(b.phase>=2 && rnd()<0.4) b.dashT=0.3;
    }
    if(b.cd<=0 && adist>=220){ bossVolley(b,3,10,700,0.6); b.cd=rr(1.2,1.8); }
  }
  else if(st==='blade'){                   // 刀客：贴身压制 + 三连斩
    if(adist>130) b.x -= Math.sign(dist)*(b.phase>=3?330:260)*dt;
    if(b.cd<=0 && adist<170){
      b.combo=(b.combo||0)+1;
      bossMelee(b,110,110,0.8);
      b.cd = b.combo>=3 ? rr(1.1,1.5) : 0.34;      // 三连斩后才有硬直
      if(b.combo>=3) b.combo=0;
    }
    if(b.cd<=0 && adist>=170 && b.phase>=2){
      b.dashT=0.34; b.cd=rr(1.6,2.2);
    }
    if(b.dashT>0){ b.dashT-=dt; b.x-=b.face*640*dt; }
  }
  else if(st==='twin'){                    // 双子：扇形弹幕 + 召唤援军
    b.teleT=(b.teleT||6)-dt;
    if(b.teleT<=0 && b.phase>=2){ bossSummon(b,'gunner',2); b.teleT=rr(6,8); }
    if(b.dashT>0){ b.dashT-=dt; b.x-=b.face*520*dt; }
    else if(b.cd<=0){
      if(adist<200){ bossMelee(b,100,100,0.9); b.cd=rr(1.0,1.4); }
      else { bossVolley(b,b.phase>=2?5:3,14,760,0.55); b.cd=rr(1.3,1.9); }
    }
  }
  else if(st==='havoc'){                   // 狂澜：重拳 + 震地 + 冲撞
    if(bossSlam(b,dt)){ b.x=clamp(b.x,80,L.width-80); return; }
    if(adist>150) b.x -= Math.sign(dist)*(b.phase>=3?300:210)*dt;
    if(b.cd<=0){
      if(adist<175){ bossMelee(b,135,130,1.15); b.cd=b.phase===3?rr(0.8,1.1):rr(1.2,1.6); }
      else if(rnd()<0.5){ b.slamT=0.5; b.cd=99; }     // 起跳预警 0.5 秒
      else { bossVolley(b,4,12,680,0.6); b.cd=rr(1.5,2.1); }
    }
  }
  else if(st==='warlord'){                 // 总帅：三阶段换招，会召唤
    if(bossSlam(b,dt)){ b.x=clamp(b.x,80,L.width-80); return; }
    b.teleT=(b.teleT||8)-dt;
    if(b.teleT<=0 && b.phase>=2){ bossSummon(b,b.phase>=3?'shield':'thug',2); b.teleT=rr(7,9); }
    if(adist>150) b.x -= Math.sign(dist)*(b.phase>=3?280:200)*dt;
    if(b.cd<=0){
      if(adist<185){ bossMelee(b,140,130,1.1); b.cd=b.phase===3?rr(0.7,1.0):rr(1.1,1.5); }
      else { bossVolley(b,b.phase>=2?5:3,16,700,0.6); b.cd=rr(1.2,1.8); }
    }
  }
  else {                                   // 铁面：稳扎稳打
    if(adist>150) b.x -= Math.sign(dist)*90*dt;
    if(b.cd<=0){
      if(adist<190){ bossMelee(b,120,120,1); b.cd=b.phase===3?rr(0.8,1.1):rr(1.2,1.6); }
      else { bossVolley(b,3,11,640,0.55); b.cd=rr(1.4,2.0); }
    }
  }
  b.x=clamp(b.x,80,L.width-80);
}

function damageEnemy(e,dmg,fx,fy,knock,isMelee,part){
  if(e.dead) return;
  // 盾卫：正面挡子弹（远程），近战不受此限制 —— 逼玩家换武器或绕后
  if(e.c.frontGuard && !isMelee){
    const toE=Math.atan2((e.y-34*(e.c.h||1))-fy, e.x-fx);
    const facing=e.face>0?0:Math.PI;
    if(Math.abs(((toE-facing+Math.PI*3)%(Math.PI*2))-Math.PI) > Math.PI*0.45){
      dmg = dmg*(1-e.c.frontGuard);
    }
  }
  // 近战武器对盾卫的破防倍率
  if(isMelee && e.c.frontGuard) dmg *= (W().vsShield||1);
  dmg = Math.max(1, Math.round(dmg));
  e.hp-=dmg; e.flash=0.08; e.hurtT=0.12;
  floats.push({v:dmg,x:e.x+rr(-8,8),y:e.y-60*(e.c.h||1)-10,t:0,life:0.7});
  // 击飞物理：冲量 = knock / mass。轻的会被抽飞出去再落地，壮汉只是晃一下，boss 几乎不动
  if(knock && !e.c.knife){
    const m=e.c.mass||1;
    const dir=Math.atan2((e.y-34*(e.c.h||1))-fy, e.x-fx);
    const pw=knock/m;
    if(e.t==='boss'){ e.x += Math.cos(dir)*pw*0.02; }
    else {
      // 冲量必须 clamp：不封顶的话霰弹 8 颗弹丸同时命中 + 连射会无限累加，
      // 敌人直接被打到天上 1000 多像素再也落不下来。
      const upMax=Math.min(900, Math.max(240, pw*1.3));
      e.kx=clamp((e.kx||0)+Math.cos(dir)*pw*0.75, -600, 600);
      e.ky=Math.max((e.ky||0)-pw*1.15+Math.sin(dir)*pw*0.30, -upMax);
      e.air=1;
      e.stun=Math.max(e.stun||0, 0.16+pw/1100);
      if(part==='leg')  e.slow=1.4;      // 打腿：减速
      if(part==='head') e.stun+=0.12;    // 爆头：硬直更久
    }
  }
  for(let i=0;i<4;i++) puff(e.x,e.y-34*(e.c.h||1),COL.danger);
  // BOSS 每掉 25% 血掉一个急救包：给长 BOSS 战一个「打得好就能续」的正反馈，
  // 否则后期 BOSS 战只能靠开局那一管血硬撑，实际不可通关。
  if(e.t==='boss' && e.hp>0){
    e.dropStage=e.dropStage||0;
    const th=[0.75,0.5,0.25];
    while(e.dropStage<3 && e.hp/e.hpMax <= th[e.dropStage]){
      // 掉到 50% 那一档掉护甲片，另外两档掉急救包：一场 BOSS 战里甲和血各补一次
      if(e.dropStage===1)
        kits.push({x:clamp(e.x+rr(-140,140),120,L.width-120),y:GROUND,taken:false,life:20,type:'armor'});
      else
        kits.push({x:clamp(e.x+rr(-140,140),120,L.width-120),y:GROUND,taken:false,life:16});
      e.dropStage++;
    }
  }
  if(e.hp<=0){
    e.dead=true; killed++;
    // 击杀掉落急救包：给一条用进攻换续航的路，奖励主动清场而不是绕着走
    if(e.t!=='boss' && Math.random()<0.18*diff.drop) kits.push({x:e.x,y:GROUND,taken:false,life:14});
    // 护甲片：清场奖励。普通兵 12%，BOSS 必掉一块
    if(e.t!=='boss' && Math.random()<0.12*diff.drop)
      kits.push({x:clamp(e.x+rr(-30,30),120,L.width-120),y:GROUND,taken:false,life:16,type:'armor'});
    if(e.t==='boss') kits.push({x:e.x,y:GROUND,taken:false,type:'armor'});
    // 生化模式：感染者有概率掉血清，这是唯一能压感染值的来源
    if(mode.key==='bio' && e.c.infect && Math.random()<0.12)
      kits.push({x:e.x,y:GROUND,taken:false,life:14,type:'serum'});
    for(let i=0;i<10;i++) puff(e.x,e.y-34*(e.c.h||1),COL.enemy);
    if(e.t==='boss'){ goalDone=true; hint='击败：'+e.c.name; hintT=3; }
  }
  sfx('hit');
}

// ============================================================
//  子弹
// ============================================================
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.life-=dt;
    if(b.grenade){
      b.vy+=1400*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.y>=GROUND){ b.y=GROUND; b.vy*=-0.35; b.vx*=0.6; }
      // 敌方炸弹碰到玩家就引爆（原版 explode() 只打敌人，敌方炸弹会打不到人）
      if(!b.friendly && d2(b.x,b.y,P.x,P.y-38) < 48*48) b.life=Math.min(b.life,0);
      if(b.life<=0){
        if(b.friendly) explode(b.x,b.y);
        else blastPlayer(b.x,b.y,b.dmg,150);
        bullets.splice(i,1);
      }
      continue;
    }
    // ---- 弹道积分：重力 + 风 + 空气阻力 ----
    b.px=b.x; b.py=b.y;                       // 记录扫掠起点（防高速穿透）
    if(b.g) b.vy += b.g*dt;
    if(wind && b.g) b.vx += wind*dt;
    if(b.drag){ const k=Math.pow(1-Math.min(0.9,b.drag),dt); b.vx*=k; b.vy*=k; }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.trail){ b.trail.push(b.x,b.y); if(b.trail.length>12) b.trail.splice(0,2); }
    let gone=false;
    if(b.friendly){
      for(const e of enemies){
        if(e.dead) continue;
        if(b.hit && b.hit.has(e)) continue;
        const ey=e.y-34*(e.c.h||1);
        // 扫掠命中：拿上一帧到这一帧的线段做判定。弹速 1600 时一帧走 27px，
        // 用点判定会让高速弹直接穿过敌人不结算。
        if(!segNear(e.x,ey,b.px,b.py,b.x,b.y,22+14*(e.c.h||1))) continue;
        // 命中部位：按命中点相对身体的高度分头/身/腿
        const h=e.c.h||1, foot=e.y, headTop=foot-56*h;
        let part='body', mul=1;
        if(b.y < headTop+16*h){ part='head'; mul=cls.headMul; }
        else if(b.y > foot-18*h){ part='leg'; mul=PHYS.legMul; }
        const dmg=Math.max(1,Math.round(b.dmg*mul));
        if(b.boom){
          // 榴弹：直击照常吃全额，周围再吃一圈溅射（只算溅射这把枪会弱到没人用）
          damageEnemy(e,dmg,b.x,b.y,b.knock||120,false,part);
          explode(b.x,b.y,b.boom,Math.round(b.dmg*0.6));
          gone=true; break;
        }
        damageEnemy(e,dmg,b.x,b.y,b.knock||120,false,part);
        if(part==='head'){ floats.push({v:'爆头',x:e.x,y:e.y-74*h,t:0,life:0.85,gold:true}); shake=Math.max(shake,7); }
        // 穿透弹（狙击）打完一个继续飞，但要记住打过谁，否则同一目标每帧都结算
        if(b.pierce>0){ (b.hit||(b.hit=new Set())).add(e); b.pierce--; continue; }
        gone=true; break;
      }
    } else {
      // 敌方子弹先判定友军：站在你和敌人之间的队友会替你挡下这一发
      for(const a of allies){
        if(a.dead) continue;
        if(segNear(a.x,a.y-34,b.px,b.py,b.x,b.y,20)){
          a.hp-=b.dmg; a.flash=0.08;
          for(let i=0;i<3;i++) puff(a.x,a.y-34,COL.cyan);
          if(a.hp<=0){
            a.dead=true; hint='友军倒下了'; hintT=1.6;
            for(let i=0;i<10;i++) puff(a.x,a.y-34,COL.cyan);
          }
          gone=true; break;
        }
      }
      if(!gone && segNear(P.x,P.y-38,b.px,b.py,b.x,b.y,24)){
        hurtPlayer(b.dmg);
        if(b.infect) addInfect(b.infect);      // 酸液命中也累积感染
        gone=true;
      }
    }
    if(!gone){
      for(const pl of L.plats||[]){
        if(b.x>pl.x&&b.x<pl.x+pl.w&&b.y>pl.y-6&&b.y<pl.y+pl.h+8){
          // 跳弹：从上往下打到台面就向上反，从侧面打到就水平反
          if(b.bounce>0 && !b.boom) ricochet(b, b.py<=pl.y?-1:1, pl.y);
          else { gone=true; puff(b.x,b.y,COL.mute); }
          break;
        }
      }
      if(!gone && b.y>=GROUND-2){
        if(b.bounce>0 && !b.boom) ricochet(b,-1,GROUND);
        else {
          // 榴弹没打中人也该落地炸
          if(b.boom) explode(b.x,GROUND,b.boom,Math.round(b.dmg*0.6));
          else puff(b.x,GROUND,COL.mute);
          gone=true;
        }
      }
    }
    if(gone||b.life<=0||b.x<-200||b.x>L.width+200) bullets.splice(i,1);
  }
}
// 跳弹：按入射面反射，损失能量与伤害。弹得太弱就直接结束，免得在地上乱蹦
function ricochet(b,mode,surfaceY){
  if(mode<0){ b.y=surfaceY-2; b.vy=-Math.abs(b.vy)*PHYS.restitution; b.vx*=PHYS.friction; }
  else      { b.vx=-b.vx*PHYS.restitution; b.vy*=PHYS.friction; }
  b.bounce--;
  b.dmg=Math.max(1,Math.round(b.dmg*PHYS.bounceLoss));
  if(Math.hypot(b.vx,b.vy)<90) b.life=-1;
  for(let i=0;i<3;i++) puff(b.x,b.y,COL.gold);
  sfx('hit');
}
function explode(x,y,rad,base){
  // rad/base 可传：手雷用默认全屏范围，榴弹炮用自己的爆炸半径
  const R=rad||190, B=base||150;
  shake=Math.max(shake,12);
  for(let i=0;i<24;i++) puff(x+rr(-R*0.18,R*0.18),y+rr(-R*0.18,R*0.18),COL.gold);
  for(const e of enemies){
    if(e.dead) continue;
    const d=Math.hypot(e.x-x,(e.y-34*(e.c.h||1))-y);
    if(d<R) damageEnemy(e, Math.max(1, Math.round(B*(1-d/R))), x, y, 0, false);
  }
  sfx('boom');
}
// 敌方爆炸：范围伤害玩家（玩家的爆炸用的是 explode，那一侧只打敌人）
function blastPlayer(x,y,dmg,rad){
  shake=Math.max(shake,10);
  for(let i=0;i<18;i++) puff(x+rr(-55,55),y+rr(-40,40),COL.danger);
  const d=Math.hypot(P.x-x,(P.y-38)-y);
  // 爆炸冲击绕过一部分护甲（pierce 0.4）：否则一件甲就能把炸弹兵完全废掉
  if(d<rad) hurtPlayer(Math.max(1,Math.round(dmg*(1-d/rad))), 0.4);
  sfx('boom');
}
function hurtPlayer(d, pierce){
  if(P.invuln>0) return;
  let dmg=d*(1-cls.dmgCut);
  // 护甲先吃：按兵种吸收率扣甲，甲值等量消耗，剩下的才进血
  if(P.armor>0){
    const ab=Math.min(P.armor, dmg*(1-(pierce||0))*cls.absorb);
    if(ab>0){
      P.armor-=ab; dmg-=ab;
      for(let i=0;i<4;i++) puff(P.x+rr(-10,10), P.y-36+rr(-12,12), '#A9C6DE');
      if(P.armor<=0.01){                       // 破甲：震屏 + 提示，这是节奏转折点
        P.armor=0;
        floats.push({v:'护甲破碎',x:P.x,y:P.y-72,t:0,life:1.1,armor:true});
        shake=Math.max(shake,11); sfx('boom');
      }
    }
  }
  P.hp-=dmg; P.hurtFlash=0.3; P.invuln=0.6; shake=Math.max(shake,8);
  if(P.armor<=0) sfx('hurt');
  if(P.hp<=0){ P.hp=0; screen='over'; }
}
function checkGoal(){
  if(goalDone) return;
  const g=L.goal;
  // 「抵达终点」必须同时满足击杀门槛：玩家速度(305)远高于敌兵(70-130)，
  // 只判距离的话可以完全不打直接跑过关，整关就废了。
  if(g.type==='reach' && P.x>=g.x && killed>=(g.minKills||0)) goalDone=true;
  else if(g.type==='boss' && bossRef && bossRef.dead) goalDone=true;
  if(goalDone){ hint='任务完成'; hintT=3; }
}
function finishLevel(){
  // 无尽模式没有结局：直接推进下一关
  if(mode.key==='endless'){ loadLevel(LIdx+1); hint='进入第 '+(LIdx+2)+' 区'; hintT=2.5; return; }
  if(mode.key==='bio'){ screen='win'; return; }
  // 通关才放结局；中途过关直接进下一关的简报（否则结局会被当成每关回执播一遍）
  if(LIdx>=LEVELS.length-1){ briefMode='debrief'; briefIdx=0; screen='story'; return; }
  pendingNext=LIdx+1;
  L=LEVELS[pendingNext]; briefMode='brief'; briefIdx=0; screen='story';
}

// ============================================================
//  粒子 / 音效
// ============================================================
function puff(x,y,c){ parts.push({x:x,y:y,vx:rr(-140,140),vy:rr(-180,60),t:0,life:rr(0.25,0.5),c:c,r:rr(2,4)}); }
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t+=dt; p.vy+=520*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.t>=p.life) parts.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.t+=dt; if(f.t>=f.life) floats.splice(i,1); }
  for(let i=beams.length-1;i>=0;i--){ const b=beams[i]; b.t+=dt; if(b.t>=b.life) beams.splice(i,1); }
  for(let i=swings.length-1;i>=0;i--){ const s=swings[i]; s.t+=dt; if(s.t>=s.life) swings.splice(i,1); }
  // 弹壳：抛出后受重力、落地弹一下、自转 —— 纯装饰，但让「开枪」有重量感
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i]; s.t+=dt;
    s.vy+=1500*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.a+=s.va*dt;
    if(s.y>=GROUND && s.vy>0){
      s.y=GROUND;
      if(s.vy>220 && s.bounced<1){ s.vy=-s.vy*0.30; s.vx*=0.40; s.bounced++; s.va*=0.5; }
      else { s.vy=0; s.vx*=0.82; s.va*=0.85; }
    }
    if(s.t>=s.life) shells.splice(i,1);
  }
}
let AC=null; const lastSfx={};
function sfx(k){
  if(muted) return;
  if(lastSfx[k]&&T-lastSfx[k]<0.05) return;
  lastSfx[k]=T;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    const m={shot:[180,0.06,'square',0.045],shotgun:[90,0.16,'sawtooth',0.07],
      sniper:[420,0.12,'triangle',0.06],swing:[260,0.09,'triangle',0.05],
      hit:[300,0.04,'square',0.03],hurt:[120,0.18,'sawtooth',0.08],
      boom:[60,0.4,'sawtooth',0.09]}[k]||[300,0.05,'sine',0.04];
    o.type=m[2]; o.frequency.value=m[0];
    o.frequency.exponentialRampToValueAtTime(Math.max(40,m[0]*0.4),AC.currentTime+m[1]);
    g.gain.setValueAtTime(m[3],AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+m[1]);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+m[1]+0.02);
  }catch(err){}
}

// ============================================================
//  绘制
// ============================================================
function stick(x,y,face,anim,scale,color,lw){
  const s=scale||1; X.save(); X.translate(x,y); X.scale(face*s,s);
  X.strokeStyle=color; X.lineWidth=(lw||3.2)/s; X.lineCap='round'; X.lineJoin='round';
  const sw=Math.sin(anim)*0.55;
  X.beginPath(); X.moveTo(0,0); X.lineTo(sw*14,-20);
  X.moveTo(0,0); X.lineTo(-sw*14,-20); X.stroke();
  X.beginPath(); X.moveTo(0,0); X.lineTo(2,-38); X.stroke();
  X.beginPath(); X.arc(4,-48,8.5,0,6.2832); X.fillStyle=color; X.fill();
  X.restore();
}
function stickArmed(x,y,face,anim,scale,color,aim,gunLen,lw,noGun){
  const s=scale||1; X.save(); X.translate(x,y); X.scale(face*s,s);
  X.strokeStyle=color; X.lineWidth=(lw||3.2)/s; X.lineCap='round'; X.lineJoin='round';
  const sw=Math.sin(anim)*0.5;
  X.beginPath(); X.moveTo(0,0); X.lineTo(sw*14,-20); X.moveTo(0,0); X.lineTo(-sw*14,-20); X.stroke();
  X.beginPath(); X.moveTo(0,0); X.lineTo(2,-38); X.stroke();
  X.beginPath(); X.arc(4,-48,8.5,0,6.2832); X.fillStyle=color; X.fill();
  const la = face>0? aim : (Math.PI-aim);
  const sx=2, sy=-30;
  const hx=sx+Math.cos(la)*16, hy=sy+Math.sin(la)*16;
  X.beginPath(); X.moveTo(1,-32); X.lineTo(hx,hy); X.stroke();
  if(!noGun){
    // 敌人/友军手里的枪：管线 + 一小段枪身，远看也像把枪
    X.strokeStyle=COL.steel; X.lineWidth=4/s;
    X.beginPath(); X.moveTo(hx,hy); X.lineTo(hx+Math.cos(la)*gunLen, hy+Math.sin(la)*gunLen); X.stroke();
    X.save();
    X.translate(hx+Math.cos(la)*gunLen*0.45, hy+Math.sin(la)*gunLen*0.45); X.rotate(la);
    X.fillStyle='#5A6675'; X.fillRect(-gunLen*0.22,-2.6/s,gunLen*0.42,5.2/s);
    X.restore();
  }
  X.restore();
}
// 枪械外观：6 把各有外形（局部坐标 +x = 枪口方向，+y 向下）
function drawGun(x,y,a,id){
  X.save(); X.translate(x,y); X.rotate(a);
  const ST='#9AA6B4', DK='#4A5563', BD='#3B4753', WD='#6B4A2A';
  X.lineJoin='round';
  if(id===10){                       // 手枪：套筒 + 握把 + 扳机护圈
    X.fillStyle=DK; X.fillRect(-9,-4,31,8);
    X.fillStyle=ST; X.fillRect(-9,-4,31,2.5);
    X.fillStyle=BD; X.fillRect(-8,2,10,16);
    X.strokeStyle=ST; X.lineWidth=2;
    X.beginPath(); X.arc(2,14,4.5,-0.4,2.8); X.stroke();
    X.fillStyle='#2E353E'; X.fillRect(20,-2,4,4);
  } else if(id===11){                // 霰弹枪：粗管 + 泵动握把 + 木托
    X.fillStyle=WD; X.save(); X.translate(-18,1); X.rotate(-0.16);
    X.fillRect(-16,-5,20,11); X.restore();
    X.fillStyle=DK; X.fillRect(-12,-5,32,10);
    X.strokeStyle=ST; X.lineWidth=8;
    X.beginPath(); X.moveTo(6,0); X.lineTo(40,0); X.stroke();
    X.fillStyle=WD; X.fillRect(6,4,20,8);
    X.fillStyle='#2E353E'; X.fillRect(36,-5,6,10);
  } else if(id===12){                // 突击步枪：机匣 + 弹匣 + 提把 + 消焰器
    X.fillStyle=WD; X.fillRect(-26,-5,14,10);
    X.fillStyle=DK; X.fillRect(-14,-5,32,10);
    X.strokeStyle=ST; X.lineWidth=5;
    X.beginPath(); X.moveTo(14,0); X.lineTo(36,0); X.stroke();
    X.fillStyle=WD; X.fillRect(-12,-14,14,5);
    X.fillStyle=BD; X.save(); X.translate(1,4); X.rotate(0.13);
    X.fillRect(-5,0,11,19); X.restore();
    X.fillStyle=ST; X.fillRect(33,-3.5,6,7);
  } else if(id===13){                // 狙击枪：超长枪管 + 瞄准镜 + 两脚架
    X.fillStyle=WD; X.save(); X.translate(-6,0); X.rotate(-0.10);
    X.fillRect(-22,-7,24,15); X.restore();
    X.fillStyle=BD; X.fillRect(-8,-4,34,8);
    X.strokeStyle=DK; X.lineWidth=6;
    X.beginPath(); X.moveTo(10,0); X.lineTo(56,0); X.stroke();
    X.fillStyle='#2E353E'; X.fillRect(6,-12,22,7);
    X.fillStyle='#2E353E'; X.fillRect(8,-11,3,5); X.fillRect(20,-11,3,5);
    X.fillStyle=COL.cyan; X.fillRect(24,-11,3.5,5);          // 镜片反光
    X.strokeStyle=DK; X.lineWidth=2;
    X.beginPath(); X.moveTo(30,3); X.lineTo(25,14); X.moveTo(34,3); X.lineTo(39,14); X.stroke();
  } else if(id===14){                // 冲锋枪：短枪身 + 长弹匣 + 折叠托
    X.strokeStyle=DK; X.lineWidth=2.5;
    X.beginPath(); X.moveTo(-8,3); X.lineTo(-22,8); X.stroke();
    X.fillStyle=DK; X.fillRect(-10,-4,26,8);
    X.strokeStyle=ST; X.lineWidth=4;
    X.beginPath(); X.moveTo(12,0); X.lineTo(26,0); X.stroke();
    X.fillStyle=BD; X.save(); X.translate(0,3); X.rotate(0.07);
    X.fillRect(-4,0,10,23); X.restore();
    X.fillStyle=WD; X.fillRect(-10,4,8,13);
  } else {                           // 榴弹炮：粗短管 + 弹鼓 + 膛内榴弹
    X.fillStyle=WD; X.fillRect(-20,-6,12,12);
    X.fillStyle='#4A5563'; X.fillRect(-10,-7,28,14);
    X.strokeStyle=ST; X.lineWidth=11;
    X.beginPath(); X.moveTo(0,0); X.lineTo(28,0); X.stroke();
    X.fillStyle=BD; X.beginPath(); X.arc(-4,8,9,0,6.2832); X.fill();
    X.fillStyle='#E2903C'; X.beginPath(); X.arc(28,0,5.5,0,6.2832); X.fill();
    X.fillStyle='#2E353E'; X.fillRect(24,-6,5,12);

  X.restore();

// 枪管长度（枪口焰的定位用），与 drawGun 里的外形对应
const BARREL={10:22,11:40,12:38,13:56,14:26,15:28};
// 武器外观：近战每把都有刃/柄/护手，带高光与材质区分
function drawWeaponBlade(x,y,a,len,w){
  const id = w? w.id : W().id;
  X.save(); X.translate(x,y); X.rotate(a);
  X.lineCap='round';
  const BL='#DCE4EC', HI='#FFFFFF', MT='#8A94A0', DK='#5A6675', WD='#6B4A2A', GD='#C8A24A';
  const grip=(x0,lg)=>{              // 柄：皮革缠绕
    X.strokeStyle=WD; X.lineWidth=6;
    X.beginPath(); X.moveTo(x0,0); X.lineTo(x0+lg,0); X.stroke();
    X.strokeStyle='#4A3520'; X.lineWidth=1.4;
    for(let i=0;i<3;i++){ const gx=x0+3+i*5;
      X.beginPath(); X.moveTo(gx,-3); X.lineTo(gx+2.5,3); X.stroke(); }
  };
  const guard=gx=>{ X.fillStyle=DK; X.fillRect(gx-2,-9,4,18); };
  if(id===6){                        // 拳套：铁块 + 铆钉
    X.fillStyle=MT; X.strokeStyle=DK; X.lineWidth=2;
    X.beginPath(); X.rect(-6,-9,16,18); X.fill(); X.stroke();
    X.beginPath(); X.rect(6,-7,13,14); X.fill(); X.stroke();
    X.fillStyle=HI; X.globalAlpha=0.5;
    X.fillRect(-4,-7,12,2.5); X.fillRect(8,-5,9,2); X.globalAlpha=1;
    X.fillStyle=DK;
    X.beginPath(); X.arc(-2,4,1.6,0,6.2832); X.fill();
    X.beginPath(); X.arc(12,3,1.6,0,6.2832); X.fill();
  }
  else if(id===7){                   // 双刀：一长一短，两刃带高光
    X.strokeStyle=BL; X.lineWidth=4;
    X.beginPath(); X.moveTo(0,0); X.lineTo(len,0); X.stroke();
    X.beginPath(); X.moveTo(0,10); X.lineTo(len*0.7,10); X.stroke();
    X.strokeStyle=HI; X.globalAlpha=0.45; X.lineWidth=1.4;
    X.beginPath(); X.moveTo(2,-1.4); X.lineTo(len-2,-1.4); X.stroke();
    X.beginPath(); X.moveTo(2,8.6); X.lineTo(len*0.7-2,8.6); X.stroke();
    X.globalAlpha=1; grip(-13,12);
  }
  else if(id===8){                   // 太刀：弧刃 + 圆形护手（tsuba）
    X.strokeStyle='#E4EAF0'; X.lineWidth=5;
    X.beginPath(); X.moveTo(0,0);
    X.quadraticCurveTo(len*0.6,-8,len,2); X.stroke();
    X.strokeStyle=HI; X.globalAlpha=0.4; X.lineWidth=1.6;
    X.beginPath(); X.moveTo(2,-2); X.quadraticCurveTo(len*0.6,-10,len-2,0); X.stroke();
    X.globalAlpha=1;
    X.strokeStyle=GD; X.lineWidth=2.5;
    X.beginPath(); X.ellipse(0,0,3.5,8,0,0,6.2832); X.stroke();
    grip(-16,14);
  }
  else if(id===9){                   // 链枷：链条环 + 带刺重头
    X.strokeStyle=MT; X.lineWidth=2.2;
    for(let i=1;i<=4;i++){
      const cx=len*0.2*i, cy=8-Math.abs(i-2.5)*2;
      X.beginPath(); X.arc(cx,cy,3.2,0,6.2832); X.stroke();
    }
    X.fillStyle=MT; X.strokeStyle=DK; X.lineWidth=2;
    X.beginPath(); X.arc(len*0.85,2,10,0,6.2832); X.fill(); X.stroke();
    for(let k=0;k<4;k++){
      const ang=k*1.57+0.4;
      X.beginPath(); X.moveTo(len*0.85+Math.cos(ang)*9,2+Math.sin(ang)*9);
      X.lineTo(len*0.85+Math.cos(ang)*14,2+Math.sin(ang)*14); X.stroke();
    }
    grip(-12,11);
  }
  else if(id===0){                   // 短刀：护手 + 刃高光
    grip(-14,14); guard(0);
    X.strokeStyle=BL; X.lineWidth=5;
    X.beginPath(); X.moveTo(0,0); X.lineTo(len,0); X.stroke();
    X.strokeStyle=HI; X.globalAlpha=0.5; X.lineWidth=1.6;
    X.beginPath(); X.moveTo(1,-1.7); X.lineTo(len-3,-1.7); X.stroke(); X.globalAlpha=1;
  }
  else if(id===1){                   // 长棍：木纹 + 两端铁箍
    X.strokeStyle='#8A6B3A'; X.lineWidth=6;
    X.beginPath(); X.moveTo(0,0); X.lineTo(len,0); X.stroke();
    X.strokeStyle='#5E4425'; X.lineWidth=1.5;
    X.beginPath(); X.moveTo(4,-1.6); X.lineTo(len-4,-1.6); X.stroke();
    X.fillStyle=MT; X.strokeStyle=DK; X.lineWidth=1.6;
    X.fillRect(2,-4,5,8); X.strokeRect(2,-4,5,8);
    X.fillRect(len-8,-4,5,8); X.strokeRect(len-8,-4,5,8);
  }
  else if(id===2){                   // 长矛：矛尖 + 红缨
    X.strokeStyle='#8A6B3A'; X.lineWidth=5;
    X.beginPath(); X.moveTo(0,0); X.lineTo(len-16,0); X.stroke();
    X.fillStyle=BL; X.beginPath();
    X.moveTo(len-16,0); X.lineTo(len,-6); X.lineTo(len,6); X.closePath(); X.fill();
    X.strokeStyle=HI; X.globalAlpha=0.5; X.lineWidth=1.4;
    X.beginPath(); X.moveTo(len-14,-1.5); X.lineTo(len-3,-3.4); X.stroke(); X.globalAlpha=1;
    X.strokeStyle='#C0392B'; X.lineWidth=2.5;
    X.beginPath(); X.moveTo(len-18,-2); X.lineTo(len-9,-9);
    X.moveTo(len-18,2); X.lineTo(len-9,9); X.stroke();
  }
  else if(id===3){                   // 双节棍：两节 + 短链
    X.strokeStyle='#6B4A2A'; X.lineWidth=4;
    X.beginPath(); X.moveTo(0,0); X.lineTo(18,0); X.stroke();
    X.strokeStyle=MT; X.lineWidth=1.8;
    X.beginPath(); X.moveTo(18,-4); X.lineTo(24,-4); X.moveTo(18,4); X.lineTo(24,4); X.stroke();
    X.strokeStyle='#6B4A2A'; X.lineWidth=4;
    X.beginPath(); X.arc(26,0,13,-1.5,1.5); X.stroke();
  }
  else if(id===4){                   // 大锤：重锤头 + 纹理
    X.strokeStyle=WD; X.lineWidth=6;
    X.beginPath(); X.moveTo(0,0); X.lineTo(len-22,0); X.stroke();
    grip(-4,14);
    X.fillStyle=MT; X.strokeStyle=DK; X.lineWidth=3;
    X.beginPath(); X.rect(len-26,-18,26,36); X.fill(); X.stroke();
    X.strokeStyle='#5E6B78'; X.lineWidth=2;
    X.beginPath(); X.moveTo(len-24,-9); X.lineTo(len-4,-9);
    X.moveTo(len-24,0); X.lineTo(len-4,0); X.moveTo(len-24,9); X.lineTo(len-4,9); X.stroke();
  }
  else if(id===5){                   // 鞭：分段鞭节 + 金属尖头
    X.strokeStyle=GD; X.lineWidth=3;
    X.beginPath(); X.moveTo(0,0);
    X.quadraticCurveTo(len*0.5,-18,len,6); X.stroke();
    X.fillStyle=GD;
    for(let i=1;i<=6;i++){
      const t=i/7, cx=len*t, cy=-36*t*(1-t)+6*t*t;
      X.beginPath(); X.arc(cx,cy,2.2,0,6.2832); X.fill();
    }
    X.fillStyle=BL; X.beginPath(); X.arc(len,6,3.5,0,6.2832); X.fill();
    grip(-14,13);
  }
  else { X.strokeStyle=COL.steel; X.lineWidth=4;
    X.beginPath(); X.moveTo(0,0); X.lineTo(len,0); X.stroke(); }
  X.restore();
}

// ---------- 真实感辅助：天空渐变 / 远景雾带 / 光晕 ----------
function skyGrad(){
  const g=X.createLinearGradient(0,0,0,GROUND);
  if(PAL.key==='street'){ g.addColorStop(0,'#090D12'); g.addColorStop(0.55,'#111922'); g.addColorStop(1,'#1B2530'); }
  else if(PAL.key==='under'){ g.addColorStop(0,'#0C0708'); g.addColorStop(1,'#1E1112'); }
  else if(PAL.key==='tower'){ g.addColorStop(0,'#060C13'); g.addColorStop(0.6,'#0E1B28'); g.addColorStop(1,'#173044'); }
  else if(PAL.key==='bio'){ g.addColorStop(0,'#060F0A'); g.addColorStop(1,'#12251A'); }
  else { g.addColorStop(0,'#090705'); g.addColorStop(1,'#1D150C'); }
  return g;
}
function fogBand(y,h,a,col){                 // 远景雾：底部渐显
  const g=X.createLinearGradient(0,y-h,0,y);
  g.addColorStop(0,'rgba('+col+',0)');
  g.addColorStop(1,'rgba('+col+','+a+')');
  X.fillStyle=g; X.fillRect(0,y-h,CW,h);
}
function halo(x,y,r,col){                    // 光源光晕
  const g=X.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g; X.fillRect(x-r,y-r,r*2,r*2);
}

// 远景：四章各画一套，换章时整个背景换皮

  const ox=-(camX*0.25)%260, ox2=-(camX*0.5)%200;

    for(let i=-1;i<11;i++){ const bx=i*340+ox0, hh=90+((i*97)%5)*46;
      X.fillRect(bx,GROUND-hh,220,hh);

    }

    for(let i=-1;i<10;i++){ const bx=i*200+ox2;

  else if(PAL.style==='under'){                 // 地下：管道电缆 + 砖柱 + 熔炉光

    X.fillStyle=PAL.edge;
    for(let gx=-((camX*0.5)%180)-180;gx<CW;gx+=180){ X.fillRect(gx,114,14,38); X.fillRect(gx,168,14,24); }
    // 垂落电缆：悬链弧线

      X.beginPath(); X.moveTo(bx,146);
      X.quadraticCurveTo(bx+150,146+26+(i%3)*8,bx+300,146); X.stroke();
    }
    // 承重柱：砖缝 + 柱脚阴影
    X.fillStyle=PAL.far;
    for(let i=-1;i<9;i++){ const bx=i*260+ox;
      X.fillRect(bx,GROUND-300,96,300);
      X.fillStyle='rgba(0,0,0,0.25)';
      for(let by=GROUND-296;by<GROUND-44;by+=34) X.fillRect(bx,by,96,2);
      X.fillStyle='rgba(0,0,0,0.5)'; X.fillRect(bx,GROUND-56,96,56);
      X.fillStyle=PAL.far;
    }
    const pulse=0.55+0.45*Math.sin(T*2.2);

    for(let i=-1;i<6;i++){ const bx=i*420+ox2; X.fillRect(bx+40,GROUND-130,96,44); }

    for(let i=-1;i<6;i++){ const bx=i*420+ox2;
      halo(bx+88,GROUND-108,130,'rgba(226,90,74,'+(0.11*pulse).toFixed(3)+')'); }
    fogBand(GROUND-20,110,0.07,'120,80,70');
  }
  else if(PAL.style==='tower'){                 // 高塔：幕墙反光 + 尖塔 + 冷蓝光
    for(let i=-1;i<9;i++){ const bx=i*200+ox2, hh=280+((i*53)%4)*70;
      const g=X.createLinearGradient(bx,0,bx+160,0);
      g.addColorStop(0,PAL.far); g.addColorStop(0.5,'rgba(130,190,230,0.10)'); g.addColorStop(1,PAL.far);
      X.fillStyle=g; X.fillRect(bx,GROUND-hh,160,hh);
      if(i%3===0){ X.fillStyle=PAL.far;         // 顶部尖塔

        X.lineTo(bx+102,GROUND-hh); X.closePath(); X.fill(); }
    }
    X.strokeStyle=PAL.edge; X.lineWidth=1; X.globalAlpha=0.45;

    for(let r=0;r<9;r++){ const gy=GROUND-40*r;

  else {                                        // 总部：柱头柱础 + 战旗 + 火焰光晕

function drawWorld(){
  X.fillStyle=skyGrad(); X.fillRect(0,0,CW,CH);
  drawFar();
  X.fillStyle=PAL.edge; X.fillRect(-camX,GROUND,L.width,8);
  const gg=X.createLinearGradient(0,GROUND+8,0,CH);
  gg.addColorStop(0,PAL.ground); gg.addColorStop(1,'#060809');
  X.fillStyle=gg; X.fillRect(-camX,GROUND+8,L.width,CH-GROUND);
  X.fillStyle='rgba(255,255,255,0.03)';        // 碎石纹理（确定性，不闪）
  for(let gx=48;gx<L.width;gx+=48){ const r=(gx*2654435761)%97;
    X.fillRect(gx-camX+(r%40),GROUND+18+(r%50),4,2); }
  X.strokeStyle='rgba(120,134,150,0.14)'; X.lineWidth=2;
  for(let gx=0;gx<L.width;gx+=120){ X.beginPath(); X.moveTo(gx-camX,GROUND+8); X.lineTo(gx-camX,CH); X.stroke(); }
  for(const pl of L.plats||[]){
    X.fillStyle=PAL.plat; X.fillRect(pl.x-camX,pl.y,pl.w,pl.h);
    X.fillStyle=PAL.edge; X.fillRect(pl.x-camX,pl.y,pl.w,4);
    X.strokeStyle='rgba(10,12,15,0.85)'; X.lineWidth=2; X.strokeRect(pl.x-camX,pl.y,pl.w,pl.h);
  }
  // 暗角：压暗画面四角，聚焦中部（画在角色层之下）
  const vg=X.createRadialGradient(CW/2,CH/2,CH*0.45,CW/2,CH/2,CH*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.34)');
  X.fillStyle=vg; X.fillRect(0,0,CW,CH);
  if(L.goal.type==='reach'){
    const gx=L.goal.x;
    X.strokeStyle=goalDone?COL.hp:COL.gold; X.lineWidth=3;
    X.beginPath(); X.moveTo(gx-camX,GROUND); X.lineTo(gx-camX,GROUND-120); X.stroke();
    X.fillStyle=goalDone?COL.hp:COL.gold;
    X.beginPath(); X.moveTo(gx-camX,GROUND-140); X.lineTo(gx-camX+22,GROUND-120);
    X.lineTo(gx-camX,GROUND-100); X.closePath(); X.fill();
  }
}
function drawKits(){
  for(const k of kits){
    if(k.taken) continue;
    const bob=Math.sin(T*4+k.x)*4;
    X.save(); X.translate(k.x-camX, k.y-16+bob);
    if(k.type==='serum'){                       // 血清：青色小瓶
      X.fillStyle='rgba(111,211,232,0.85)'; X.strokeStyle='#0A0C0F'; X.lineWidth=2;
      X.beginPath(); X.rect(-7,-12,14,24); X.fill(); X.stroke();
      X.fillStyle='#E8EDF2'; X.fillRect(-4,-17,8,6);
      X.fillStyle='#0A0C0F'; X.fillRect(-4,-6,8,10);
    } else if(k.type==='armor'){                // 护甲片：钢蓝甲板 + 四颗铆钉
      X.fillStyle='#9FB6C9'; X.strokeStyle='#0A0C0F'; X.lineWidth=2;
      X.beginPath(); X.moveTo(-12,-11); X.lineTo(12,-11); X.lineTo(9,10); X.lineTo(-9,10);
      X.closePath(); X.fill(); X.stroke();
      X.fillStyle='rgba(240,248,255,0.55)'; X.fillRect(-7,-7,6,3);
      X.fillStyle='#0A0C0F';
      X.fillRect(-8,-6,3,3); X.fillRect(5,-6,3,3); X.fillRect(-7,3,3,3); X.fillRect(4,3,3,3);
    } else {                                    // 急救包
      X.fillStyle='#E8EDF2'; X.strokeStyle='#0A0C0F'; X.lineWidth=2;
      X.beginPath(); X.rect(-13,-13,26,26); X.fill(); X.stroke();
      X.fillStyle=COL.danger;
      X.fillRect(-8,-3,16,6); X.fillRect(-3,-8,6,16);
    }
    X.restore();
  }
}
function drawSwings(){
  for(const s of swings){
    const k=1-s.t/s.life;
    X.save(); X.translate(s.x-camX,s.y); X.rotate(s.a);
    X.globalAlpha=k*0.55; X.fillStyle=COL.line;
    X.beginPath(); X.moveTo(0,0);
    X.arc(0,0,s.r,-s.arc*Math.PI/360,s.arc*Math.PI/360); X.closePath(); X.fill();
    X.restore();
  }
  X.globalAlpha=1;
}
function drawEnemies(){

    if(ex<-140||ex>CW+140) continue;

    const sc=e.c.h||1;
    if(e.t==='boss'){
      stickArmed(ex,ey,e.face,e.anim,sc,col,Math.atan2((P.y-38)-(ey-34*sc),P.x-e.x),
                 e.key==='shadow'?26:34,3.0/sc);
    } else if(e.c.melee){
      stickArmed(ex,ey,e.face,e.anim,sc,col,Math.atan2((P.y-38)-(ey-34*sc),P.x-e.x),26,3.0/sc);
      if(e.t==='shield'){
        X.fillStyle='rgba(180,190,205,0.55)'; X.strokeStyle=COL.steel; X.lineWidth=2.5;

    } else {

                 e.c.knife?14:(e.t==='sniper'?30:20),3.0/sc);
      if(e.t==='gunshield'){      // 盾枪手：又挡子弹又能还击
        X.fillStyle='rgba(180,190,205,0.55)'; X.strokeStyle=COL.steel; X.lineWidth=2.5;
        X.beginPath(); X.rect(ex+e.face*16-7, ey-58*sc, 14, 40*sc); X.fill(); X.stroke();

        X.beginPath(); X.rect(ex-e.face*16-5, ey-52*sc, 11, 15); X.fill(); X.stroke();
      }
      if(e.t==='flamer'){         // 喷火兵：背后的燃料罐 + 短喷管
        X.fillStyle='rgba(226,120,50,0.85)'; X.strokeStyle='#0A0C0F'; X.lineWidth=1.5;
        X.beginPath(); X.rect(ex-e.face*18-5, ey-54*sc, 12, 18); X.fill(); X.stroke();
        X.strokeStyle='#8A94A0'; X.lineWidth=4;
        X.beginPath(); X.moveTo(ex+e.face*12, ey-34*sc);
        X.lineTo(ex+e.face*30, ey-34*sc); X.stroke();
      }
      if(e.t==='medic'){          // 医师：头顶绿十字（优先击杀标记）
        const my2=ey-72*sc;
        X.fillStyle=COL.hp;
        X.fillRect(ex-3,my2-9,6,18); X.fillRect(ex-9,my2-3,18,6);
      }

    if(e.warnT>0){
      const k=1-e.warnT/(e.c.charge||1);

function drawPlayer(){
  const px=P.x-camX, py=P.y;
  const w=W();
  const gl = w.kind==='melee' ? w.range*0.55 : (w.id===13?34:(w.id===15?30:22));
  if(P.dash>0){ X.globalAlpha=0.45; stick(px-P.face*26,py,P.face,P.anim,1,COL.cyan,3.2); X.globalAlpha=1; }
  const col = P.hurtFlash>0?'#FFFFFF':(P.invuln>0?'#9FE1CB':COL.ink);
  // noGun=true：玩家手里的枪由 drawGun 单独画，不用 stickArmed 里的简笔枪管
  stickArmed(px,py,P.face,P.anim,1,col,P.aim,gl,3.2,true);
  // 防具外观：有甲才画头盔 + 胸甲。甲越少钢色越旧；低于 40% 出现裂纹，碎了就不画
  if((P.armor||0)>0.5){
    const ak=clamp(P.armor/(P.armorMax||1),0,1);
    const steel = ak>0.55? '#AEBECD' : (ak>0.28? '#94A2AE' : '#7E8892');
    X.save(); X.translate(px,py); X.scale(P.face,1); X.lineJoin='round';
    // 头盔：半球 + 护耳
    X.fillStyle=steel; X.strokeStyle='#1A2027'; X.lineWidth=2;
    X.beginPath(); X.arc(4,-49,10.4,Math.PI,0); X.closePath(); X.fill(); X.stroke();
    X.beginPath(); X.moveTo(-6,-49); X.lineTo(-7.5,-41); X.lineTo(-1.5,-41); X.closePath();
    X.fill(); X.stroke();
    X.fillStyle='rgba(245,250,255,0.45)'; X.fillRect(0,-57,6,3);        // 顶部高光
    // 胸甲：上宽下窄的甲板
    X.fillStyle=steel; X.strokeStyle='#1A2027'; X.lineWidth=2;
    X.beginPath(); X.moveTo(-9,-40); X.lineTo(11,-40); X.lineTo(9,-19); X.lineTo(-8,-19);
    X.closePath(); X.fill(); X.stroke();
    X.strokeStyle='rgba(18,24,30,0.5)'; X.lineWidth=1;
    X.beginPath(); X.moveTo(-8,-31); X.lineTo(10,-31); X.stroke();       // 甲片分割
    X.fillStyle='rgba(245,250,255,0.5)';                                // 铆钉
    X.fillRect(-6,-38,2,2); X.fillRect(7,-38,2,2);
    X.fillRect(-5,-27,2,2); X.fillRect(7,-27,2,2);
    if(ak<0.4){                                                         // 低甲：裂纹
      X.strokeStyle='rgba(18,24,30,0.75)'; X.lineWidth=1.4;
      X.beginPath(); X.moveTo(1,-40); X.lineTo(3,-33); X.lineTo(-1,-27); X.lineTo(1,-20); X.stroke();
    }
    X.restore();
  }
  // 兵种外观：四个兵种一眼能认出来（都画在身体上，武器再盖在上面）
  X.save(); X.translate(px,py); X.scale(P.face,1); X.lineCap='round';
  if(cls.key==='assault'){                     // 突击：飘带
    X.strokeStyle=COL.cyan; X.lineWidth=3;
    X.beginPath(); X.moveTo(2,-34);
    X.quadraticCurveTo(-14+Math.sin(P.anim*2)*6,-30,-22,-24); X.stroke();
  } else if(cls.key==='sniper'){               // 狙击：长帽檐
    X.fillStyle='#3B4753';
    X.beginPath(); X.moveTo(-2,-53); X.lineTo(21,-51); X.lineTo(-2,-46); X.closePath(); X.fill();
  } else if(cls.key==='heavy'){                // 重装：肩甲 + 胸甲
    X.fillStyle='#6B7683'; X.strokeStyle='#3B4753'; X.lineWidth=2;
    X.beginPath(); X.ellipse(2,-46,15,8,0,0,6.2832); X.fill(); X.stroke();
    X.fillStyle='#5A6675'; X.fillRect(-7,-40,15,14);
  } else {                                     // 工程：背包
    X.fillStyle='#7A6A4A'; X.strokeStyle='#3B4753'; X.lineWidth=2;
    X.beginPath(); X.rect(-17,-40,13,20); X.fill(); X.stroke();
  }
  X.restore();
  const mx=px+Math.cos(P.aim)*(gl+14), my=py-38+Math.sin(P.aim)*(gl+14);
  // 第 5 个参数是武器对象（供图标复用同一套画法），不是线宽
  if(w.kind==='melee') drawWeaponBlade(mx,my,P.aim,clamp(w.range*0.55,40,150),w);
  else drawGun(mx,my,P.aim,w.id);
  // 枪口焰：三层（外焰/内焰/白核）+ 一道侧向火舌，位置与 drawGun 的管口对齐
  if(muzzle>0 && w.kind==='gun'){
    const k=clamp(muzzle/0.07,0,1), bar=BARREL[w.id]||30;
    const bx=mx+Math.cos(P.aim)*bar, by=my+Math.sin(P.aim)*bar;
    X.save(); X.translate(bx,by); X.rotate(P.aim);
    X.fillStyle='rgba(255,150,40,'+(0.50*k)+')';
    X.beginPath(); X.moveTo(0,-5*k); X.lineTo(24*k,0); X.lineTo(0,5*k); X.closePath(); X.fill();
    X.fillStyle='rgba(255,190,70,'+(0.60*k)+')';
    X.beginPath(); X.arc(2*k,0,13*k,0,6.2832); X.fill();
    X.fillStyle='rgba(255,232,150,'+(0.85*k)+')';
    X.beginPath(); X.arc(1*k,0,7*k,0,6.2832); X.fill();
    X.fillStyle='rgba(255,255,255,'+(0.90*k)+')';
    X.beginPath(); X.arc(0,0,3.2*k,0,6.2832); X.fill();
    X.restore();
  }
}
function drawBullets(){
  for(const b of bullets){
    const bx=b.x-camX, by=b.y;
    if(b.grenade){
      const mine=b.friendly;
      X.fillStyle=mine?'#4ADE80':COL.danger; X.strokeStyle='#0A0C0F'; X.lineWidth=2;
      X.beginPath(); X.arc(bx,by,7,0,6.2832); X.fill(); X.stroke();
      if(!mine){    // 敌方炸弹闪一下提示，落地就炸
        X.strokeStyle=Math.floor(T*10)%2?'#FFE08A':'rgba(255,224,138,0.3)'; X.lineWidth=2;
        X.beginPath(); X.arc(bx,by,12,0,6.2832); X.stroke();
      }
      continue;
    }
    if(b.friendly){
      // 拖尾：有重力的弹会画出一条弧，肉眼直接看得出下坠
      if(b.trail && b.trail.length>=4){
        X.strokeStyle='rgba(255,224,138,0.30)'; X.lineWidth=2;
        X.beginPath(); X.moveTo(b.trail[0]-camX,b.trail[1]);
        for(let i=2;i<b.trail.length;i+=2) X.lineTo(b.trail[i]-camX,b.trail[i+1]);
        X.lineTo(bx,by); X.stroke();
      }
      X.strokeStyle='#FFE08A'; X.lineWidth=b.owner===13?4:3;
      X.beginPath(); X.moveTo(bx,by); X.lineTo(bx-b.vx*0.016,by-b.vy*0.016); X.stroke();
    } else if(b.flame){
      X.fillStyle='rgba(255,140,50,0.50)';
      X.beginPath(); X.arc(bx,by,10,0,6.2832); X.fill();
      X.fillStyle='rgba(255,224,138,0.80)';
      X.beginPath(); X.arc(bx,by,5,0,6.2832); X.fill();
    } else {
      X.fillStyle='#FF8A80'; X.beginPath(); X.arc(bx,by,4,0,6.2832); X.fill();
    }
  }
  drawShells();
  for(const b of beams){
    const k=1-b.t/b.life;
    X.strokeStyle='rgba(255,224,138,'+k+')'; X.lineWidth=3;
    X.beginPath(); X.moveTo(b.x1-camX,b.y1); X.lineTo(b.x2-camX,b.y2); X.stroke();
  }
}
function drawShells(){
  for(const s of shells){
    X.save(); X.translate(s.x-camX,s.y); X.rotate(s.a);
    X.globalAlpha=Math.min(1,(1-s.t/s.life)*1.8);
    X.fillStyle=COL.gold; X.fillRect(-3.5,-1.6,7,3.2);

  }
  X.globalAlpha=1;
}
// 弹道预测线：把当前枪的重力/阻力/风积分一遍画成虚线。
// 没有这条线，"下坠"就只是打不准；有了它，抬枪补偿才成为可学的技巧。
function drawTrajectory(){
  if(!PHYS.on) return;
  const w=W();
  if(w.kind!=='gun' || w.hitscan) return;    // 狙击弹速 3100，下坠可忽略，不画线免得干扰
  const mx=P.x+Math.cos(P.aim)*26, my=P.y-38+Math.sin(P.aim)*26;
  let x=mx, y=my, vx=Math.cos(P.aim)*w.pspd, vy=Math.sin(P.aim)*w.pspd;
  const g=w.grav||0, dr=w.drag||0;
  X.save(); X.setLineDash([6,7]);
  X.strokeStyle='rgba(111,211,232,0.45)'; X.lineWidth=2;
  X.beginPath(); X.moveTo(x-camX,y);
  for(let i=0;i<26;i++){
    const dt=0.022;
    vy+=g*dt; if(wind) vx+=wind*dt;
    if(dr){ const k=Math.pow(1-Math.min(0.9,dr),dt); vx*=k; vy*=k; }
    x+=vx*dt; y+=vy*dt;
    if(y>GROUND) break;
    X.lineTo(x-camX,y);
  }
  X.stroke(); X.restore();
  // 落点标记
  X.fillStyle='rgba(111,211,232,0.7)';
  X.beginPath(); X.arc(x-camX,Math.min(y,GROUND),3,0,6.2832); X.fill();
}
function drawParts(){
  for(const p of parts){ const k=1-p.t/p.life; X.globalAlpha=k; X.fillStyle=p.c;
    X.fillRect(p.x-camX-p.r/2,p.y-p.r/2,p.r,p.r); }
  X.globalAlpha=1;
  X.textAlign='center'; X.font='500 18px sans-serif';
  for(const f of floats){ const k=1-f.t/f.life; X.globalAlpha=k;
    X.strokeStyle='#0A0C0F'; X.lineWidth=3;
    X.strokeText(f.v,f.x-camX,f.y-k*34);
    X.fillStyle = f.armor?'#A9C6DE' : (f.heal?COL.hp : (f.gold?COL.gold:'#FFE08A'));   // 护甲钢蓝 / 治疗绿 / 爆头金 / 伤害黄
    X.fillText(f.v,f.x-camX,f.y-k*34); }
  X.globalAlpha=1;
}

function drawHud(){
  X.fillStyle='rgba(10,13,17,0.82)'; X.fillRect(0,0,CW,64);

  X.fillStyle=COL.line; X.font='500 13px sans-serif'; X.textAlign='left';

    + (PHYS.on ? '　风 '+(Math.abs(wind)<8?'无':(wind>0?'→ ':'← ')+Math.abs(Math.round(wind))) : ''),

  // 武器栏（16 把，两行 × 8 列）

    X.fillText(KEYOF(i)+' '+WEAPONS[i].name, bx+(bw-8)/2+11, by+16);
    if(own){
      X.font='500 10px sans-serif';
      if(WEAPONS[i].kind==='melee'){
        X.fillStyle=COL.cyan;
        X.fillText('近战 无限 · 程'+WEAPONS[i].range, bx+(bw-8)/2, by+32);
      } else {
        const a=P.ammo[i], m=WEAPONS[i].mag;
        X.fillStyle=a===0?COL.danger:(a<m*0.34?COL.gold:COL.mute);
        X.fillText(a+' / '+m + (WEAPONS[i].explosive?' · 爆':''), bx+(bw-8)/2, by+32);
      }
    } else { X.fillStyle='#3F4750'; X.font='400 11px sans-serif';
      X.fillText('未解锁', bx+(bw-8)/2, by+36); }
  }
  if(P.reloading>0 && w.kind==='gun'){
    const rbx=CW-20-8*bw, rby=CH-34-2*bh-14;
    X.fillStyle='rgba(10,13,17,0.8)'; X.fillRect(rbx,rby,8*bw,10);
    X.fillStyle=COL.cyan; X.fillRect(rbx,rby,8*bw*(1-P.reloading/w.reload),10);
  }
  X.textAlign='left'; X.fillStyle=COL.mute; X.font='500 12px sans-serif';
  X.fillText('手雷 [G] ×'+P.grenades+'   '+(P.dashCd>0?'闪避 '+P.dashCd.toFixed(1)+'s':'闪避 [Shift] 就绪'), 20, CH-16);
  X.fillStyle= w.kind==='melee'?COL.cyan:COL.gold; X.font='500 13px sans-serif';
  X.fillText((w.kind==='melee'?'近战 · ':'枪械 · ')+w.tip, 20, CH-36);
  if(hintT>0){ X.textAlign='center'; X.fillStyle=COL.gold; X.font='500 20px sans-serif';
    X.fillText(hint,CW/2,120); }
  drawCrosshair();
}
function drawCrosshair(){
  const w=W();
  const sp = w.kind==='melee' ? 10 + w.range*0.05 : 9 + w.spread*1.6 + (P.fireCd>0?7:0);
  X.strokeStyle='rgba(255,255,255,0.9)'; X.lineWidth=2;
  X.beginPath();
  X.moveTo(mouse.x-sp,mouse.y); X.lineTo(mouse.x-sp*0.45,mouse.y);
  X.moveTo(mouse.x+sp*0.45,mouse.y); X.lineTo(mouse.x+sp,mouse.y);
  X.moveTo(mouse.x,mouse.y-sp); X.lineTo(mouse.x,mouse.y-sp*0.45);
  X.moveTo(mouse.x,mouse.y+sp*0.45); X.lineTo(mouse.x,mouse.y+sp);
  X.stroke();
  X.fillStyle='rgba(255,255,255,0.9)'; X.fillRect(mouse.x-1,mouse.y-1,2,2);
}

// ============================================================
//  界面
// ============================================================
function drawTitle(){
  X.fillStyle='#0A0C0F'; X.fillRect(0,0,CW,CH);
  for(let i=0;i<10;i++){ const bx=(i*137+((T*8)%137))%CW;
    X.fillStyle='#141A21'; X.fillRect(bx,GROUND-260-((i*53)%7)*40,110,300); }
  stickArmed(CW/2-170,GROUND,1,T*3,2.4,COL.ink,0.3,90,3.6);
  stickArmed(CW/2+170,GROUND,-1,T*3+1.4,2.4,COL.enemy,Math.PI-0.3,90,3.6);
  X.textAlign='center';
  X.fillStyle=COL.line; X.font='500 54px sans-serif'; X.fillText('火柴人大战',CW/2,116);
  X.fillStyle=COL.gold; X.font='500 19px sans-serif'; X.fillText('多 武 器 · 冷 兵 器 与 枪 械',CW/2,148);

  // ---- 模式选择 ----
  X.fillStyle=COL.gold; X.font='500 15px sans-serif';
  X.fillText('选择模式　[Tab]',CW/2,180);
  const mbw=300, mbh=48, mgap=16, mtotal=3*mbw+2*mgap, mx0=(CW-mtotal)/2, mby=192;
  for(let i=0;i<3;i++){

    X.fillRect(bx,mby,mbw,mbh);
    X.strokeStyle=sel?COL.gold:'#2E353E'; X.lineWidth=sel?3:1.5; X.strokeRect(bx,mby,mbw,mbh);
    X.fillStyle=sel?COL.gold:COL.line; X.font='500 21px sans-serif';
    X.fillText(m.name, bx+mbw/2, mby+22);
    X.font='400 12px sans-serif'; X.fillStyle=sel?COL.line:COL.mute;
    X.fillText(m.sub, bx+mbw/2, mby+40);
  }

  // ---- 难度选择 ----
  X.fillStyle=COL.cyan; X.font='500 15px sans-serif';
  X.fillText('选择难度　[1] [2] [3] [4]　或　← →',CW/2,278);
  const bw=196, bh=64, gap=14, total=4*bw+3*gap, x0=(CW-total)/2, by=296;
  for(let i=0;i<4;i++){

    X.fillRect(bx,by,bw,bh);
    X.strokeStyle=sel?COL.gold:'#2E353E'; X.lineWidth=sel?3:1.5; X.strokeRect(bx,by,bw,bh);
    X.fillStyle=sel?COL.gold:COL.line; X.font='500 20px sans-serif';
    X.fillText('['+(i+1)+'] '+d.name, bx+bw/2, by+27);
    X.font='400 12px sans-serif'; X.fillStyle=sel?COL.line:COL.mute;
    X.fillText('血 ×'+d.hp+'　伤 ×'+d.atk+'　量 ×'+d.count+'　你 '+d.php+' 血', bx+bw/2, by+48);
  }
  X.fillStyle=COL.mute; X.font='400 14px sans-serif';
  X.fillText(diff.tip, CW/2, by+bh+24);

  // ---- 兵种选择 ----
  X.fillStyle=COL.cyan; X.font='500 15px sans-serif';
  X.fillText('选择兵种　[Z] [X] [C] [V]',CW/2,by+bh+62);
  const cy=by+bh+80;
  for(let i=0;i<4;i++){
    const c=CLASSES[i], bx=x0+i*(bw+gap), sel=c.key===cls.key;
    X.fillStyle=sel?'rgba(111,211,232,0.16)':'rgba(20,25,31,0.85)';
    X.fillRect(bx,cy,bw,58);
    X.strokeStyle=sel?COL.cyan:'#2E353E'; X.lineWidth=sel?3:1.5; X.strokeRect(bx,cy,bw,58);
    X.fillStyle=sel?COL.cyan:COL.line; X.font='500 19px sans-serif';
    X.fillText('['+['Z','X','C','V'][i]+'] '+c.name, bx+bw/2, cy+24);
    X.font='400 11px sans-serif'; X.fillStyle=sel?COL.line:COL.mute;
    X.fillText(c.sum, bx+bw/2, cy+44);
  }
  X.fillStyle=COL.mute; X.font='400 14px sans-serif';
  X.fillText(cls.tip, CW/2, cy+58+22);

  const lines=[
    'A / D 移动     W 跳跃（二段）     鼠标瞄准 · 左键攻击',

    'G 手雷     P 暂停     M 静音     F 弹道物理开关',
    '枪械带弹道物理：下坠、跳弹、后坐力、爆头；敌方 11 种兵，先杀医师',
    '护甲：挨打先掉甲、甲碎才掉血。捡甲片补 40 点，爆炸会绕过一部分甲'
  ];
  X.font='400 16px sans-serif'; let y=cy+58+58;
  for(const l of lines){
    X.fillStyle = l.startsWith('枪械')?COL.cyan:(l.startsWith('护甲')?'#A9C6DE':COL.line);
    X.fillText(l,CW/2,y); y+=25;
  }
  X.fillStyle=COL.gold; X.font='400 15px sans-serif';
  X.fillText(mode.tip, CW/2, y+2);

  X.font='500 26px sans-serif'; X.fillText('按 Enter 开始',CW/2,y+48);
}
function drawStory(){
  X.fillStyle='#0A0C0F'; X.fillRect(0,0,CW,CH);
  X.globalAlpha=0.3; stick(CW/2,GROUND,1,T*2,3,COL.ink,3.6); X.globalAlpha=1;
  const lines = briefMode==='brief' ? L.brief : ENDING;
  const t = lines[briefIdx];
  X.fillStyle='rgba(10,13,17,0.9)'; X.fillRect(0,CH-300,CW,300);
  X.fillStyle='rgba(240,185,60,0.9)'; X.fillRect(0,CH-300,CW,3);
  X.textAlign='center';
  X.fillStyle=COL.mute; X.font='400 14px sans-serif';
  X.fillText(briefMode==='brief'?'简报':'结局', CW/2, CH-266);
  X.fillStyle=COL.gold; X.font='500 26px sans-serif';
  X.fillText(briefMode==='brief'? ('第 '+L.no+' 关 · '+L.name) : '道场', CW/2, CH-232);
  X.fillStyle=COL.line; X.font='400 22px sans-serif';
  X.fillText(t||'', CW/2, CH-176);
  X.fillStyle=COL.mute; X.font='400 14px sans-serif';
  X.fillText((briefIdx+1)+' / '+lines.length+'    空格或回车继续', CW/2, CH-40);
}
const ENDING=['你打赢了所有人。','道场还是塌了。','但你把那块招牌捡了回来。','——有些东西砸得坏，有些砸不坏。'];
function drawEnd(win){
  X.fillStyle='rgba(10,12,15,0.92)'; X.fillRect(0,0,CW,CH);
  X.textAlign='center';
  stick(CW/2,GROUND,1,T*2,2.6,win?COL.cyan:COL.enemy,3.6);
  let ti, su, st;
  if(mode.key==='bio'){
    ti = win? '清除完毕':'感染';
    su = win? '八波都挡下来了。':'你也成了它们的一员。';
    st = '坚持到第 '+bioWave+' 波 · 击杀 '+killed+' · 感染 '+Math.round(P.infect||0)+'%';
  } else if(mode.key==='endless'){
    ti = win? '通关':'阵亡';
    su = '第 '+(LIdx+1)+' 关倒下。';
    st = '本局最高 第 '+bestEndless+' 关 · 击杀 '+killed;
  } else {
    ti = win?'通关':'倒下';
    su = win?'道场可以重建。':'这一次的记录没人看见。';
    st = '第 '+(LIdx+1)+' 关 · 击杀 '+killed;
  }
  X.fillStyle=win?COL.gold:COL.danger; X.font='500 52px sans-serif';
  X.fillText(ti,CW/2,216);
  X.fillStyle=COL.mute; X.font='400 18px sans-serif';
  X.fillText(su,CW/2,262);
  X.fillStyle=COL.line; X.font='500 20px sans-serif';
  X.fillText(st,CW/2,308);
  X.fillStyle=COL.mute; X.font='400 18px sans-serif';
  X.fillText(win?'按 Enter 回到标题':'按 Enter 重试 · 按 R 回标题',CW/2,372);
}
function drawPause(){
  X.fillStyle='rgba(10,12,15,0.74)'; X.fillRect(0,0,CW,CH);
  X.textAlign='center'; X.fillStyle=COL.gold; X.font='500 44px sans-serif';
  X.fillText('暂停',CW/2,CH/2-10);
  X.fillStyle=COL.line; X.font='400 16px sans-serif'; X.fillText('按 P 继续',CW/2,CH/2+30);
}

// ============================================================
//  主循环
// ============================================================
let last=performance.now()/1000;
function loop(now){
  const nT=now/1000;
  // dt 必须夹在 [0,0.05]：时钟回跳/首帧差值为负时整套计时会失效
  let raw=Math.max(0,Math.min(0.05,nT-last)); last=nT;
  DT=raw; T+=raw;

  if(once('m')) muted=!muted;
  if(once('p') && screen==='play') paused=!paused;
  if(once('u')){ for(let i=0;i<WEAPONS.length;i++) P.owned[i]=true; }
  // F：弹道物理总开关。关掉后子弹走直线、无跳弹无下坠，方便对比手感
  if(once('f')){ PHYS.on=!PHYS.on; wind = PHYS.on ? rr(-PHYS.windMax,PHYS.windMax) : 0;
    hint='弹道物理：'+(PHYS.on?'开':'关'); hintT=1.6; }

  if(screen==='title'){
    let d0=DIFF_ORDER.indexOf(diff.key);
    if(once('ArrowLeft'))  { d0=(d0+3)%4; diff=DIFFS[DIFF_ORDER[d0]]; }
    if(once('ArrowRight')) { d0=(d0+1)%4; diff=DIFFS[DIFF_ORDER[d0]]; }
    for(let i=0;i<4;i++) if(once(String(i+1))) diff=DIFFS[DIFF_ORDER[i]];
    const ck=['z','x','c','v'];
    for(let i=0;i<4;i++) if(once(ck[i])) cls=CLASSES[i];
    if(once('Tab')) mode=MODES[(MODES.indexOf(mode)+1)%MODES.length];
    if(once('Enter')){
      if(mode.key==='bio') loadBio();
      else if(mode.key==='endless'){ loadLevel(0); hint='无尽模式 · 从第 1 关开始'; hintT=3.0; }
      else { L=LEVELS[0]; briefMode='brief'; briefIdx=0; screen='story'; }
    }
  }
  else if(screen==='story'){
    if(once(' ')||once('Enter')||mouse.downOnce){
      briefIdx++;
      const lines = briefMode==='brief' ? L.brief : ENDING;
      if(briefIdx>=lines.length){
        if(briefMode==='brief') loadLevel(pendingNext<0?LIdx:pendingNext), pendingNext=-1;
        else { screen='win'; }
      }
    }
  }
  else if(screen==='play'){
    if(!paused){
      updatePlayer(DT);
      updateEnemies(DT);
      updateAllies(DT);
      updateBullets(DT);
      updateFx(DT);
      if(muzzle>0) muzzle-=DT;
      if(shake>0) shake=Math.max(0,shake-DT*40);
      if(hintT>0) hintT-=DT;
      if(L.boss && !bossRef && P.x>=L.bossX-520) spawnBoss(L.boss,L.bossX);
      // 急救包
      for(const k of kits){
        if(k.taken) continue;
        if(k.life!==undefined){ k.life-=DT; if(k.life<=0){ k.taken=true; continue; } }
        if(d2(P.x,P.y,k.x,k.y) < 52*52){
          k.taken=true;
          if(k.type==='serum'){                       // 血清：清感染值
            const cut=35;
            P.infect=Math.max(0,(P.infect||0)-cut);
            floats.push({v:'感染 -'+cut,x:k.x,y:k.y-40,t:0,life:0.9,heal:true});
          } else if(k.type==='armor'){                // 护甲片：补甲（封顶）
            const add=Math.max(0, Math.min(ARMOR.plate, P.armorMax-(P.armor||0)));
            P.armor=Math.min(P.armorMax,(P.armor||0)+ARMOR.plate);
            floats.push({v:add>0?('护甲 +'+Math.round(add)):'护甲已满',x:k.x,y:k.y-40,t:0,life:0.9,armor:true});
          } else {
            const heal=Math.round(45*cls.heal);
            P.hp=Math.min(P.hpMax,P.hp+heal);
            floats.push({v:'+'+heal,x:k.x,y:k.y-40,t:0,life:0.9});
          }
          sfx('hit');
        }
      }
      if(mode.key==='bio') updateBio(DT); else checkGoal();
      const want=clamp(P.x-CW*0.42,0,Math.max(0,L.width-CW));
      camX+=(want-camX)*Math.min(1,DT*7);
      if(goalDone){ if(!doneT) doneT=T; if(T-doneT>1.2){ doneT=0; finishLevel(); } }
    }
  }
  else if(screen==='over'){
    if(once('Enter')){ if(mode.key==='bio') loadBio(); else loadLevel(LIdx); }
    if(once('r')) screen='title';
  }
  else if(screen==='win'){ if(once('Enter')) screen='title'; }

  X.setTransform(1,0,0,1,0,0); X.clearRect(0,0,CW,CH);
  if(screen==='title'){ drawTitle(); }
  else {
    X.save(); X.translate(0, shake?rr(-shake,shake)*0.4:0);
    drawWorld(); drawKits(); drawTrajectory(); drawSwings(); drawEnemies(); drawAllies();
    drawBullets(); drawPlayer(); drawParts();
    X.restore();
    if(P.hurtFlash>0){ X.fillStyle='rgba(226,75,74,'+(P.hurtFlash*0.5)+')'; X.fillRect(0,0,CW,CH); }
    if(L && screen!=='story') drawHud();
    if(screen==='story') drawStory();
    if(screen==='over') drawEnd(false);
    if(screen==='win') drawEnd(true);
    if(paused && screen==='play') drawPause();
  }
  keysOnce={}; mouse.downOnce=false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
